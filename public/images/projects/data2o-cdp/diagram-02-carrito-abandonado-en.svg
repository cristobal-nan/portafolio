<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Generic Abandoned Cart Detection Workflow and Tracardi Collaboration</title>
  <desc id="desc">Sanitized conceptual diagram illustrating cart event ingestion into Tracardi, purchase completion window evaluation, and the Solutions Engineering feedback loop leading to an official Tracardi capability.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f766e" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309" />
    </marker>
    <style>
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" fill="#ffffff" rx="12" />
  <rect x="16" y="16" width="1168" height="508" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />

  <!-- Header -->
  <text x="44" y="56" class="font-sans" font-size="20" font-weight="700" fill="#0f172a">Generic Workflow: Abandoned Cart Detection (Tracardi CDP)</text>
  <text x="44" y="78" class="font-sans" font-size="12.5" fill="#475569">Conceptual cart-event pattern and technical collaboration loop from LatAm enterprise needs to an official CDP feature</text>

  <rect x="912" y="38" width="244" height="30" rx="15" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" />
  <text x="1034" y="57" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#92400e">CONCEPTUAL FLOW · NDA-SAFE</text>

  <!-- Step 1 -->
  <rect x="44" y="138" width="230" height="164" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="60" y="164" class="font-mono" font-size="10.5" font-weight="700" fill="#64748b">STEP 01 · STOREFRONT</text>
  <text x="60" y="188" class="font-sans" font-size="15" font-weight="700" fill="#0f172a">Cart Events</text>
  <text x="60" y="210" class="font-sans" font-size="12" fill="#475569">Sent via JS / REST API:</text>
  <rect x="60" y="224" width="198" height="22" rx="4" fill="#f1f5f9" />
  <text x="70" y="239" class="font-mono" font-size="11" fill="#334155">add_to_cart / update_cart</text>
  <rect x="60" y="252" width="198" height="22" rx="4" fill="#f1f5f9" />
  <text x="70" y="267" class="font-mono" font-size="11" fill="#334155">checkout_started</text>

  <!-- Step 2 -->
  <rect x="322" y="138" width="248" height="164" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="338" y="164" class="font-mono" font-size="10.5" font-weight="700" fill="#1d4ed8">STEP 02 · TRACARDI CDP</text>
  <text x="338" y="188" class="font-sans" font-size="15" font-weight="700" fill="#0f172a">Profile State</text>
  <text x="338" y="211" class="font-sans" font-size="12" fill="#334155">• Associates event to profile</text>
  <text x="338" y="232" class="font-sans" font-size="12" fill="#334155">• Tracks active cart items</text>
  <text x="338" y="249" class="font-sans" font-size="12" fill="#334155">  and last activity timestamp</text>
  <text x="338" y="271" class="font-sans" font-size="12" fill="#1d4ed8" font-weight="600">• Starts evaluation window</text>

  <!-- Step 3: Decision -->
  <rect x="618" y="152" width="224" height="136" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.75" />
  <text x="730" y="178" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#475569">STEP 03 · EVALUATION</text>
  <text x="730" y="204" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="700" fill="#0f172a">Purchase completed?</text>
  <text x="730" y="226" text-anchor="middle" class="font-sans" font-size="12" fill="#475569">Checks for arrival of</text>
  <text x="730" y="244" text-anchor="middle" class="font-mono" font-size="11.5" fill="#334155">purchase_completed</text>
  <text x="730" y="264" text-anchor="middle" class="font-sans" font-size="11.5" fill="#64748b">within the configured window</text>

  <!-- Branch A: Completed -->
  <rect x="904" y="114" width="252" height="92" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5" />
  <text x="920" y="138" class="font-mono" font-size="10.5" font-weight="700" fill="#0f766e">YES · CONVERSION</text>
  <text x="920" y="160" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">Purchase Confirmed</text>
  <text x="920" y="180" class="font-sans" font-size="11.5" fill="#475569">Clears pending cart state and</text>
  <text x="920" y="196" class="font-sans" font-size="11.5" fill="#475569">updates buyer audience segment</text>

  <!-- Branch B: Abandoned -->
  <rect x="904" y="232" width="252" height="106" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.75" />
  <text x="920" y="256" class="font-mono" font-size="10.5" font-weight="700" fill="#b45309">NO · ABANDONMENT DETECTED</text>
  <text x="920" y="278" class="font-sans" font-size="14" font-weight="700" fill="#0f172a">Abandoned Cart</text>
  <text x="920" y="298" class="font-sans" font-size="11.5" fill="#475569">Tags profile in target segment</text>
  <text x="920" y="315" class="font-sans" font-size="11.5" fill="#475569">and triggers automated CDP</text>
  <text x="920" y="331" class="font-sans" font-size="11.5" fill="#475569">segmentation / activation flow</text>

  <!-- Connectors -->
  <path d="M 274 220 L 318 220" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)" />
  <path d="M 570 220 L 614 220" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)" />
  <path d="M 842 192 C 874 192, 874 160, 900 160" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <path d="M 842 248 C 874 248, 874 285, 900 285" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow-amber)" />

  <!-- Bottom Band: Product Contribution Loop -->
  <rect x="44" y="376" width="1112" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="64" y="400" class="font-mono" font-size="10.5" font-weight="700" fill="#1d4ed8">FROM ENTERPRISE REQUIREMENTS TO OPEN-SOURCE FEATURE (SOLUTIONS ENGINEERING)</text>

  <rect x="64" y="414" width="320" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="224" y="439" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#0f172a">1. Discovery in Chile &amp; LatAm demos</text>

  <path d="M 388 434 L 424 434" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)" />

  <rect x="430" y="414" width="340" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="600" y="439" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#0f172a">2. English collaboration with Tracardi team</text>

  <path d="M 774 434 L 810 434" stroke="#475569" stroke-width="1.75" fill="none" marker-end="url(#arrow)" />

  <rect x="816" y="414" width="320" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd" />
  <text x="976" y="439" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#1d4ed8">3. Shipped as official Tracardi feature</text>

  <!-- Footer -->
  <text x="44" y="502" class="font-sans" font-size="11.5" fill="#64748b">Note: Generic diagram omitting client-specific thresholds, timings, or proprietary rules. Event identifiers shown are illustrative.</text>
</svg>
